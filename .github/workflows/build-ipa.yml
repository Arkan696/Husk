name: Build Husk IPA (zh-Hans)

# 云端打包：在 GitHub 提供的 macOS 运行器上，从干净的检出完整构建 Husk，
# 产出可侧载的 Husk.ipa（AltStore / SideStore 用）与 Husk.tipa（TrollStore 用）。
# 无需 Mac、无需 Apple 开发者账号：package_ipa.sh 采用 ad-hoc 签名，
# 安装时由 SideStore / AltStore / TrollStore 用你自己的证书重新签名。
#
# 使用：推送到你 fork 的仓库后，进入仓库 Actions 页，左侧选择
# “Build Husk IPA (zh-Hans)”，点击 “Run workflow”。首次构建约 2–4 小时
# （交叉编译 QEMU / ANGLE / MoltenVK），完成后在该次运行页面底部下载 Artifacts。

on:
  workflow_dispatch: {}
  # 如需每次推送到 main 都自动打包，取消下面两行注释（很耗时，默认关闭）：
  # push:
  #   branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build IPA / TIPA
    runs-on: macos-15          # Apple Silicon (M1)；如镜像不可用可改为 macos-14
    timeout-minutes: 360       # GitHub 单次任务上限 6 小时

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # package_ipa.sh 会读取 git commit 作为构建号

      - name: Select newest Xcode
        run: |
          set -e
          XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          # HuskJITHelper 的部署目标是 iOS 26，需要 Xcode 26（含 iOS 26 SDK）。
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install build tools
        run: |
          set -e
          # meson/ninja/pkg-config：交叉编译依赖；qemu：仅用其 qemu-img 生成磁盘种子；
          # xcodegen：必须安装，因为我们修改了 src/app/project.yml，需要重新生成工程。
          brew update -q || true
          brew install -q meson ninja pkg-config qemu xcodegen
          # virglrenderer 的 meson 构建需要 PyYAML：gallium/meson.build 以
          # modules: ['yaml'] 查找 python3。Homebrew 的 python3 默认不带 PyYAML，
          # 缺了会在 configure 阶段直接报 "missing modules: yaml" 并中断整个构建。
          # Homebrew 的 python3 是"外部管理"环境（PEP 668），所以要带
          # --break-system-packages 才能安装。
          python3 -m pip install --break-system-packages --quiet pyyaml
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          # Rust + iOS 目标（build_rppairing_ios.sh 使用）。运行器通常已预装 rustup。
          if ! command -v rustup >/dev/null 2>&1; then
            brew install -q rustup-init
            rustup-init -y --default-toolchain stable
            source "$HOME/.cargo/env"
          fi
          rustup target add aarch64-apple-ios
          rustc --version
          xcodegen --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: husk-cargo-${{ runner.os }}-${{ hashFiles('src/rppairing-ios/Cargo.lock') }}
          restore-keys: |
            husk-cargo-${{ runner.os }}-

      - name: Cache heavy native build (QEMU / ANGLE / MoltenVK / guest / sysroot)
        uses: actions/cache@v4
        with:
          # 这些目录承载了绝大部分耗时的交叉编译产物；脚本具备 skip / ninja 增量逻辑，
          # 命中缓存后再次运行通常只需重新打包 App（数分钟）。
          path: |
            third_party
            build
            guests
            src/rppairing-ios/target
          key: husk-deps-${{ runner.os }}-${{ hashFiles('scripts/sources.sh','scripts/build_ios.sh','scripts/build_angle_ios.sh','scripts/build_gpu_ios.sh','scripts/build_moltenvk_ios.sh','scripts/integrate_husk.sh','scripts/build_rppairing_ios.sh','scripts/fetch_phase0_guest.sh') }}
          restore-keys: |
            husk-deps-${{ runner.os }}-

      - name: Build everything and package IPA + TIPA
        run: ./scripts/ci_build.sh

      - name: Verify localization catalogs were compiled in
        run: |
          set -e
          APP="/tmp/husk_ipa/Build/Products/Release-iphoneos/Husk.app"
          echo "App bundle: $APP"
          echo "== app .lproj (expect a zh-Hans.lproj) =="
          find "$APP" -maxdepth 2 -type d -name '*.lproj' | sort
          echo "== widget .lproj =="
          find "$APP/PlugIns/HuskDownloadsWidget.appex" -type d -name '*.lproj' 2>/dev/null | sort || true
          test -d "$APP/zh-Hans.lproj" || { echo "::error::zh-Hans.lproj missing from app bundle"; exit 1; }

      - name: Upload IPA (AltStore / SideStore)
        uses: actions/upload-artifact@v4
        with:
          name: Husk-ipa
          path: build/Husk.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload TIPA (TrollStore)
        uses: actions/upload-artifact@v4
        with:
          name: Husk-tipa
          path: build/Husk.tipa
          if-no-files-found: error
          retention-days: 30
