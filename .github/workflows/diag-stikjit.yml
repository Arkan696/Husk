name: Diagnose StikJIT interface compatibility

# One-off diagnostic.
#
# The vendored StikJIT 1.9.0 xcframework ships ONLY textual .swiftinterface
# files (there is no binary .swiftmodule), and those interfaces are printed
# with the Swift 6.3+ "Module::Type" module-selector syntax
# (e.g. "public struct DDIPaths : Swift::Sendable").
# On macos-15 the newest Xcode is 26.3 = Swift 6.2.3, whose parser does not
# understand "::", so the app build dies with "expected '{' in struct".
#
# This job finds out which Xcode on the macos-26 image can actually consume
# that interface, before we spend 20 minutes on a full rebuild.
# Delete this workflow once the question is settled.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: List installed Xcodes
        run: |
          echo "== /Applications/Xcode*.app =="
          ls -d /Applications/Xcode*.app || true
          echo "== xcode-select default =="
          xcodebuild -version || true

      - name: Probe StikJIT import with every installed Xcode
        run: |
          set -u
          FW="$PWD/src/app/Frameworks"
          echo "framework search dir: $FW"
          ls -d "$FW"/StikJIT.xcframework/ios-arm64/StikJIT.framework || true

          PROBE="$(mktemp -d)/probe.swift"
          printf '%s\n' \
            'import StikJIT' \
            '' \
            '@available(iOS 17.4, *)' \
            'func probe() {' \
            '    let paths = StikJIT.DDIPaths(imagePath: "i", trustcachePath: "t", manifestPath: "m")' \
            '    _ = paths.imagePath' \
            '}' \
            > "$PROBE"
          echo "probe written to $PROBE"

          for XC in /Applications/Xcode*.app; do
            echo "================================================================"
            echo ">>> $XC"
            DEV="$XC/Contents/Developer"
            SWIFTC="$(DEVELOPER_DIR="$DEV" xcrun --find swiftc 2>/dev/null || true)"
            if [ -z "$SWIFTC" ] || [ ! -x "$SWIFTC" ]; then
              echo "cannot locate swiftc for this Xcode, skipping"
              continue
            fi
            echo "swiftc: $SWIFTC"
            "$SWIFTC" --version 2>&1 | head -2 || true
            SDK="$(DEVELOPER_DIR="$DEV" xcrun --sdk iphoneos --show-sdk-path 2>&1 || true)"
            echo "sdk: $SDK"
            OUT="$(mktemp)"
            set +e
            DEVELOPER_DIR="$DEV" "$SWIFTC" -typecheck \
              -target arm64-apple-ios26.0 \
              -sdk "$SDK" \
              -F "$FW" \
              "$PROBE" > "$OUT" 2>&1
            STATUS=$?
            set -e
            echo "swiftc -typecheck exit code: $STATUS"
            head -25 "$OUT"
          done

          echo "================================================================"
          echo "diagnostic finished"
